<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; padding:0; background:transparent; overflow:hidden; user-select:none; -webkit-user-select:none; font-family:-apple-system,"PingFang SC",sans-serif; }
    #stage { position:fixed; right:4px; bottom:4px; display:flex; flex-direction:column; align-items:flex-end; }
    #bubble { pointer-events:none; max-width:220px; margin-bottom:6px; padding:8px 12px; background:rgba(255,255,255,0.92); border-radius:12px; border:1px solid rgba(47,42,38,0.15); box-shadow:0 2px 12px rgba(0,0,0,0.18); opacity:0; transition:opacity 0.25s ease; }
    #bubble.show { opacity:1; }
    #bubble .title { font-size:13px; font-weight:600; color:#2f2a26; }
    #bubble .cue { font-size:12px; color:#6b5f56; margin-top:2px; }
    #view2d { width:92px; height:110px; image-rendering:pixelated; cursor:grab; }
    #zzz { position:absolute; top:-18px; right:8px; font-size:11px; color:#8b949e; opacity:0; transition:opacity 0.3s; pointer-events:none; font-style:italic; }
    #zzz.show { opacity:0.7; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bubble"><div class="title"></div><div class="cue"></div></div>
    <div style="position:relative">
      <span id="zzz">💤 zzz</span>
      <canvas id="view2d" width="92" height="110"></canvas>
    </div>
  </div>
  <script src="../../dist/renderer2d.bundle.js"></script>
</body>
</html>
