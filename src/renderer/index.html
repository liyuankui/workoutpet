<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    #stage {
      position: fixed;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    /* 拖动把手：猫本体可点击，把手区拖动窗口 */
    #grip {
      -webkit-app-region: drag;
      color: rgba(47, 42, 38, 0.35);
      font-size: 13px;
      letter-spacing: 3px;
      padding: 2px 4px;
      cursor: move;
      margin-right: 4px;
    }
    #bubble {
      pointer-events: none; /* 气泡纯展示，不挡点击 */
      max-width: 240px;
      margin-bottom: 6px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      border: 1px solid rgba(47, 42, 38, 0.15);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #bubble.show { opacity: 1; }
    #bubble .title { font-size: 13px; font-weight: 600; color: #2f2a26; }
    #bubble .cue { font-size: 12px; color: #6b5f56; margin-top: 2px; }
    #cat {
      width: 112px;  /* 16px × 7 */
      height: 112px;
      image-rendering: pixelated;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="grip">⠿⠿</div>
    <div id="bubble"><div class="title"></div><div class="cue"></div></div>
    <canvas id="cat" width="112" height="112"></canvas>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
