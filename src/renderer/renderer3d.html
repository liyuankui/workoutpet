<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    #stage {
      position: fixed;
      right: 4px;
      bottom: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    /* 气泡沿用 2D 版样式（F34 扩窗机制同用） */
    #bubble {
      pointer-events: none;
      max-width: 220px;
      margin-bottom: 6px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      border: 1px solid rgba(47, 42, 38, 0.15);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #bubble.show { opacity: 1; }
    #bubble .title { font-size: 13px; font-weight: 600; color: #2f2a26; }
    #bubble .cue { font-size: 12px; color: #6b5f56; margin-top: 2px; }
    #view3d { width: 96px; height: 110px; cursor: grab; }
    body.dragging #view3d { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bubble"><div class="title"></div><div class="cue"></div></div>
    <canvas id="view3d"></canvas>
  </div>
  <script src="../../dist/renderer3d.bundle.js"></script>
</body>
</html>
